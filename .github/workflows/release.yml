# Release (design Q13/Q14, M4-1): on a version tag, verify — typecheck, unit
# tests, and the smoke test against the pinned DSH — then publish the built
# packages as tag <tag>-dist, which projects install from.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write

jobs:
  release:
    # The smoke test drives DSH in Edge, which Windows runners ship.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NODE_ENV: production
      - run: pnpm smoke --no-build
      - name: Publish ${{ github.ref_name }}-dist
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/release.mjs "${GITHUB_REF_NAME}"
